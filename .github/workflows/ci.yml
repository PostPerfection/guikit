name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    name: Syntax check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JS syntax
        run: |
          for f in src/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Test the playlist queue
        run: node --test 'test/*.test.mjs'

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: Rust (${{ matrix.name }})

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # cmake, openssl and xerces-c build postkit's asdcplib dependency, tauri
      # needs the webkit, indicator and rsvg development files, and the render
      # thread probes need an X server and a GL driver to get a context from.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            libssl-dev \
            libxml2-dev \
            libxerces-c-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            xvfb \
            libegl1-mesa-dev \
            libgl1-mesa-dri \
            mesa-utils

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config cmake openssl@3 xerces-c
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix xerces-c):$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }

      - name: Set vcpkg env (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          # ahead of the runner's other openssl dlls, which lack the exports vcpkg's link against
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: Setup libmpv
        uses: PostPerfection/setup-libmpv@v1
        with:
          mpv-release: '20260828'
          mpv-archive: mpv-dev-x86_64-20260828-git-182fa6ca49.7z

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1.tar.xz
          tar -xJf ffmpeg.tar.xz
          echo "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"

      # homebrew's ffmpeg carries neither libass nor freetype
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # conda-forge and homebrew build ffmpeg without libzimg, and the hdr decode chain needs zscale
        run: |
          base=https://ffmpeg.martin-riedl.de/download/macos/arm64/1787073674_9.0.1
          mkdir -p "$HOME/ffmpeg-bin"
          for tool in ffmpeg ffprobe; do
            curl -fsSL --retry 5 --retry-all-errors -o "$tool.zip" "$base/$tool.zip"
            unzip -q -o "$tool.zip" -d "$HOME/ffmpeg-bin"
            chmod +x "$HOME/ffmpeg-bin/$tool"
          done
          shasum -a 256 -c <<'SUMS'
          8287a1b2229e05eb41859f073e18e6c52c60a778f2f5e6881070fe51b79407fe  ffmpeg.zip
          102a26b8940a053298d9929bfaae71e4b6ef65ba5f19a99a88c433108560741a  ffprobe.zip
          SUMS
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1.zip
          unzip -q ffmpeg.zip
          echo "$(cygpath -w "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1/bin")" >> "$GITHUB_PATH"

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.6

      - name: Check test tools
        shell: bash
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          if [ "$RUNNER_OS" = "Windows" ]; then
            ls "$MPV_LIB_DIR/mpv.lib"
          else
            pkg-config --modversion mpv
            pkg-config --modversion libgrokj2k
          fi

      - name: Build
        working-directory: rust
        run: cargo build

      - name: Test with coverage (Linux)
        if: runner.os == 'Linux'
        working-directory: rust
        run: xvfb-run -a cargo llvm-cov --lcov --output-path lcov.info

      - name: Coverage summary (Linux)
        if: runner.os == 'Linux'
        working-directory: rust
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: rust/lcov.info

      - name: Test
        if: runner.os != 'Linux'
        working-directory: rust
        run: cargo test

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        working-directory: rust
        run: cargo fmt --check
