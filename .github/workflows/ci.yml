name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    name: Syntax check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JS syntax
        run: |
          for f in src/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Test the playlist queue
        run: node --test 'test/*.test.mjs'

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: Rust (${{ matrix.name }})

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # cmake, openssl and xerces-c build postkit's asdcplib dependency, tauri
      # needs the webkit, indicator and rsvg development files, and the render
      # thread probes need an X server and a GL driver to get a context from.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            libssl-dev \
            libxml2-dev \
            libxerces-c-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            xvfb \
            libegl1-mesa-dev \
            libgl1-mesa-dri \
            mesa-utils

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config cmake openssl@3 xerces-c
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix xerces-c):$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }

      - name: Set vcpkg env (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          # ahead of the runner's other openssl dlls, which lack the exports vcpkg's link against
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: Setup libmpv
        uses: PostPerfection/setup-libmpv@v1
        with:
          mpv-release: '20260828'
          mpv-archive: mpv-dev-x86_64-20260828-git-182fa6ca49.7z

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1.tar.xz
          tar -xJf ffmpeg.tar.xz
          echo "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"

      # homebrew's ffmpeg carries neither libass nor freetype
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: ffmpeg
          create-args: ffmpeg=8.1.1=gpl_h4b93310_102
          init-shell: none

      - name: Put ffmpeg on PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$(dirname "$("${MAMBA_EXE:-micromamba}" run -n ffmpeg which ffmpeg)")" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1.zip
          unzip -q ffmpeg.zip
          echo "$(cygpath -w "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1/bin")" >> "$GITHUB_PATH"

      - name: Check test tools
        shell: bash
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          if [ "$RUNNER_OS" = "Windows" ]; then
            ls "$MPV_LIB_DIR/mpv.lib"
          else
            pkg-config --modversion mpv
          fi

      - name: Build
        working-directory: rust
        run: cargo build

      - name: Test with coverage (Linux)
        if: runner.os == 'Linux'
        working-directory: rust
        run: xvfb-run -a cargo llvm-cov --lcov --output-path lcov.info

      - name: Coverage summary (Linux)
        if: runner.os == 'Linux'
        working-directory: rust
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: rust/lcov.info

      - name: Test
        if: runner.os != 'Linux'
        working-directory: rust
        run: cargo test

      - name: Name the dll missing the test exe's imports (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" | Sort-Object Name | Select-Object -Last 1
          $dumpbin = Join-Path $msvc.FullName "bin\Hostx64\x64\dumpbin.exe"
          $exe = (Get-ChildItem rust\target\debug\deps\guikit-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          "exe: $exe"
          $exeDir = Split-Path $exe
          function Resolve-Dll($name) {
            $candidates = @("$exeDir\$name", "C:\Windows\System32\$name") + @(Get-Command $name -All -ErrorAction SilentlyContinue | ForEach-Object Source)
            return $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          function Exports($path) {
            & $dumpbin /exports $path | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+(?:[0-9A-F]{8}\s+)?(\S+)') { $Matches[1] } }
          }
          function ImportsByDll($path) {
            $byDll = @{}
            $dll = $null
            foreach ($line in (& $dumpbin /imports $path)) {
              if ($line -match '^\s+(\S+\.dll)\s*$') { $dll = $Matches[1]; $byDll[$dll] = @(); continue }
              if ($dll -and $line -match '^\s+[0-9A-F]+\s+(\S+)\s*$') { $byDll[$dll] += $Matches[1] }
            }
            return $byDll
          }
          function Check($path, $depth) {
            $byDll = ImportsByDll $path
            foreach ($name in $byDll.Keys) {
              if ($name -like 'api-ms-win-*' -or $name -like 'ext-ms-*') { continue }
              $found = Resolve-Dll $name
              if (-not $found) { "$path needs $name -> NOT FOUND"; continue }
              "$name -> $found ($((Get-Item $found).VersionInfo.FileVersion))"
              $exports = Exports $found
              $byDll[$name] | Where-Object { $exports -notcontains $_ } | ForEach-Object { "  missing in ${found}: $_" }
              if ($depth -gt 0 -and $found -notlike 'C:\Windows\*') { Check $found ($depth - 1) }
            }
          }
          Check $exe 1
          "--- loader popups in the system event log"
          Get-WinEvent -LogName System -MaxEvents 300 -ErrorAction SilentlyContinue | Where-Object { $_.Id -eq 26 } | ForEach-Object { $_.Message }
          "--- application errors"
          Get-WinEvent -LogName Application -MaxEvents 100 -ErrorAction SilentlyContinue | Where-Object { $_.LevelDisplayName -eq 'Error' } | ForEach-Object { $_.Message }

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        working-directory: rust
        run: cargo fmt --check
