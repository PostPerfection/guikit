[package]
name = "guikit"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Shared native backend for the PostPerfection wizard GUIs"

[lib]
name = "guikit"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
postkit = { git = "https://github.com/PostPerfection/postkit.git", features = [
    "libmpv",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
async-channel = "2"
libc = "0.2"

# versions match what tauri already links on each platform, so the app keeps a
# single native stack rather than two copies of objc2 or windows
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSOpenGL",
    "NSOpenGLView",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
